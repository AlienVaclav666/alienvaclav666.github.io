<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS RC600 MIDI CC -> NOTE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #121212;
            color: #e0e0e0;
        }
        h1, h2, h3 { color: #fff; margin-top: 0; }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            background: #222;
            border-left: 5px solid #ff9800;
        }
        .status.connected { border-left-color: #4caf50; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        #mappingMatrix {
            grid-template-columns: 1fr;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #mappingMatrix .card {
            display: grid;
            grid-template-columns: 110px 120px 150px minmax(180px, 1fr) minmax(220px, 1fr);
            column-gap: 12px;
            row-gap: 8px;
            align-items: end;
        }
        #mappingMatrix .card h3 {
            align-self: center;
            margin: 0;
        }
        #mappingMatrix .flex-group {
            display: contents;
        }
        #mappingMatrix .flex-group > div,
        #mappingMatrix [id^="row-"] {
            min-width: 0;
        }
        .global-settings {
            background: #1e1e1e;
        }
        label { display: block; margin-top: 10px; font-size: 0.85em; color: #aaa; }
        .inline-label { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 0.85em; color: #aaa; }
        .inline-label input { width: auto; margin: 0; }
        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .log-box {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
            color: #00ff00;
        }
        .flex-group { display: flex; gap: 10px; }
        .flex-group > div { flex: 1; }

        @media (max-width: 900px) {
            #mappingMatrix .card {
                grid-template-columns: 1fr;
            }
            #mappingMatrix .card h3 {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>

    <h1>BOSS RC600 MIDI CC -> NOTE</h1>
    
    <div id="status" class="status">Initializing Web MIDI API...</div>

    <div class="grid">
        <div class="card">
            <h2>Connections</h2>
            <label for="midiIn">Input (from USB device):</label>
            <select id="midiIn"><option value="">Select a device...</option></select>

            <label for="midiOut">Output (to synthesizer/application):</label>
            <select id="midiOut"><option value="">Select a device...</option></select>
        </div>

        <div class="card global-settings">
            <h2>Global Settings</h2>
            <label for="globalVolume">Default note velocity (0–127):</label>
            <input type="number" id="globalVolume" min="0" max="127" value="100">
            <small style="color: #777; font-size: 0.8em;">Used when the rule velocity is empty</small>
            <label for="volumeRandomization">Volume randomization:</label>
            <select id="volumeRandomization">
                <option value="5">Low (±5)</option>
                <option value="10" selected>Mid (±10)</option>
                <option value="20">High (±20)</option>
            </select>
        </div>
    </div>

    <h2>Mapping Matrix (10 Rules)</h2>
    <div id="mappingMatrix" class="grid">
        <!-- Rules generated by JavaScript -->
    </div>

    <h2>Message Preview (Log)</h2>
    <div id="log" class="log-box"></div>

    <script>
        let midiAccess = null;
        let activeInput = null;
        let activeOutput = null;
        const totalRules = 10;
        const NOTE_DURATION_MS = 100;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        function getNoteSelectOptions() {
            return Array.from({ length: 128 }, (_, i) =>
                `<option value="${i}">${noteNames[i % 12]}${Math.floor(i / 12) - 1} (MIDI ${i})</option>`
            ).join("");
        }
        const templateSettings = {
            globalVolume: 100,
            volumeRandomization: 10,
            rules: [
                { inCC: 1, outType: "NOTE", outNote: 38, outCC: 0 },
                { inCC: 5, outType: "NOTE", outNote: 38, outCC: 0 },
                { inCC: 6, outType: "NOTE", outNote: 41, outCC: 0 },
                { inCC: 8, outType: "NOTE", outNote: 69, outCC: 0 },
                { inCC: 0, outType: "NOTE", outNote: 0, outCC: 0 },
                { inCC: 0, outType: "NOTE", outNote: 0, outCC: 0 },
                { inCC: 0, outType: "NOTE", outNote: 0, outCC: 0 },
                { inCC: 0, outType: "NOTE", outNote: 0, outCC: 0 },
                { inCC: 0, outType: "NOTE", outNote: 0, outCC: 0 },
                { inCC: 0, outType: "NOTE", outNote: 0, outCC: 0 }
            ]
        };

        const statusDiv = document.getElementById('status');
        const midiInSelect = document.getElementById('midiIn');
        const midiOutSelect = document.getElementById('midiOut');
        const matrixContainer = document.getElementById('mappingMatrix');
        const logBox = document.getElementById('log');
        const el = id => document.getElementById(id);

        const noteOptionsHTML = getNoteSelectOptions();
        el('globalVolume').value = templateSettings.globalVolume;
        el('volumeRandomization').value = String(templateSettings.volumeRandomization);

        for (let i = 0; i < totalRules; i++) {
            const rule = templateSettings.rules[i] || {};
            matrixContainer.insertAdjacentHTML('beforeend', `
                <div class="card" id="rule-card-${i}">
                    <h3>Rule ${i + 1}</h3>
                    <div class="flex-group">
                        <div>
                            <label>Input CC#:</label>
                            <input type="number" id="inCC-${i}" min="0" max="127" value="${rule.inCC ?? i}">
                        </div>
                        <div>
                            <label>Output type:</label>
                            <select id="outType-${i}" onchange="updateRuleUI(${i})">
                                <option value="NOTE" ${rule.outType === "NOTE" ? 'selected' : ''}>Note (Note ON/OFF)</option>
                                <option value="CC" ${rule.outType === "CC" ? 'selected' : ''}>Other CC</option>
                            </select>
                        </div>
                    </div>

                    <div id="row-note-${i}">
                        <label>Output Note:</label>
                        <select id="outNote-${i}">${noteOptionsHTML}</select>
                    </div>

                    <div id="row-cc-${i}" style="display: none;">
                        <label>Output CC#:</label>
                        <input type="number" id="outCC-${i}" min="0" max="127" value="${rule.outCC ?? i + 10}">
                    </div>

                    <div id="row-volume-${i}">
                        <label for="outVolume-${i}">Note velocity (0–127):</label>
                        <input type="number" id="outVolume-${i}" min="0" max="127" value="" placeholder="Default">
                    </div>
                </div>
            `);
            el(`outNote-${i}`).value = rule.outNote ?? (i === 0 ? 57 : i === 1 ? 71 : 60);
        }
        function updateRuleUI(i) {
            const isNote = el(`outType-${i}`).value === "NOTE";
            el(`row-note-${i}`).style.display = isNote ? "block" : "none";
            el(`row-cc-${i}`).style.display = isNote ? "none" : "block";
            el(`row-volume-${i}`).style.display = isNote ? "block" : "none";
        }

        for (let i = 0; i < totalRules; i++) { updateRuleUI(i); }

        function randomizeNoteVelocity(volume) {
            const range = parseInt(el('volumeRandomization').value, 10);
            const variation = Math.floor(Math.random() * ((range * 2) + 1)) - range;
            return Math.max(0, Math.min(127, volume + variation));
        }

        function log(message) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML = `[${time}] ${message}<br>` + logBox.innerHTML;
        }
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess({ sysex: false }).then(onMIDISuccess, onMIDIFailure);
        } else {
            statusDiv.innerText = "Error: This browser does not support the Web MIDI API.";
        }

        function onMIDISuccess(midi) {
            midiAccess = midi;
            statusDiv.innerText = "Web MIDI API ready. Connect your USB controller.";
            statusDiv.classList.add('connected');
            updateDevices();
            midiAccess.onstatechange = updateDevices;
        }

        function onMIDIFailure(msg) { statusDiv.innerText = "MIDI error: " + msg; }

        function updateDevices() {
            const selectedInputId = midiInSelect.value || (activeInput && activeInput.id) || "";
            const selectedOutputId = midiOutSelect.value || (activeOutput && activeOutput.id) || "";
            midiInSelect.innerHTML = '<option value="">Select input...</option>';
            midiOutSelect.innerHTML = '<option value="">Select output...</option>';
            for (const input of midiAccess.inputs.values()) {
                midiInSelect.innerHTML += `<option value="${input.id}">${input.name}</option>`;
            }
            for (const output of midiAccess.outputs.values()) {
                midiOutSelect.innerHTML += `<option value="${output.id}">${output.name}</option>`;
            }

            const input = midiAccess.inputs.get(selectedInputId);
            if (input) {
                midiInSelect.value = input.id;
                if (activeInput && activeInput !== input) activeInput.onmidimessage = null;
                activeInput = input;
                activeInput.onmidimessage = handleMIDIMessage;
            } else {
                if (activeInput) activeInput.onmidimessage = null;
                activeInput = null;
            }

            activeOutput = midiAccess.outputs.get(selectedOutputId) || null;
            if (activeOutput) midiOutSelect.value = activeOutput.id;
        }

        midiInSelect.addEventListener('change', (e) => {
            if (activeInput) activeInput.onmidimessage = null;
            activeInput = midiAccess.inputs.get(e.target.value);
            if (activeInput) {
                activeInput.onmidimessage = handleMIDIMessage;
                log(`Input: ${activeInput.name}`);

                const outputs = Array.from(midiAccess.outputs.values());
                const matchingOutput = outputs.find(output => output.id === activeInput.id)
                    || outputs.find(output =>
                        output.name === activeInput.name &&
                        output.manufacturer === activeInput.manufacturer
                    )
                    || outputs.find(output => output.name === activeInput.name);

                if (matchingOutput) {
                    midiOutSelect.value = matchingOutput.id;
                    activeOutput = matchingOutput;
                    log(`Output set automatically: ${activeOutput.name}`);
                } else {
                    midiOutSelect.value = "";
                    activeOutput = null;
                    log(`No matching output found for device: ${activeInput.name}`);
                }
            } else {
                activeOutput = null;
                midiOutSelect.value = "";
            }
        });

        midiOutSelect.addEventListener('change', (e) => {
            activeOutput = midiAccess.outputs.get(e.target.value);
            if (activeOutput) log(`Output: ${activeOutput.name}`);
        });
        function handleMIDIMessage(event) {
            const data = event.data;
            const cmd = data[0] & 0xf0;
            const channel = data[0] & 0x0f;

            if (cmd === 0xB0) {
                const ccNumber = data[1];
                const ccValue = data[2];

                log(`📥 CC ${ccNumber} | Value: ${ccValue}`);
                for (let i = 0; i < totalRules; i++) {
                    const targetInCC = parseInt(el(`inCC-${i}`).value);
                    if (ccNumber === targetInCC) {
                        const outType = el(`outType-${i}`).value;
                        if (!activeOutput) return;

                        if (outType === "CC") {
                            const outCCNumber = parseInt(el(`outCC-${i}`).value);
                            activeOutput.send([0xB0 | channel, outCCNumber, ccValue]);
                            log(`👉 CC output: ${outCCNumber} | Value: ${ccValue}`);
                        } else if (outType === "NOTE") {
                            if (ccValue > 0) {
                                const noteNumber = parseInt(el(`outNote-${i}`).value);
                                const customVolume = el(`outVolume-${i}`).value.trim();
                                const globalVolume = parseInt(el('globalVolume').value);
                                const volumeValue = customVolume === ""
                                    ? (Number.isFinite(globalVolume) ? globalVolume : 100)
                                    : parseInt(customVolume);
                                const baseVelocity = Math.max(0, Math.min(127, Number.isFinite(volumeValue) ? volumeValue : 100));
                                const velocity = randomizeNoteVelocity(baseVelocity);

                                if (velocity === 0) {
                                    log(`🔇 Note ${noteNumber} skipped (velocity: 0)`);
                                    return;
                                }

                                activeOutput.send([0x90 | channel, noteNumber, velocity]);
                                log(`🎵 NOTE ON: ${noteNumber} (CC: ${ccValue}, Vel: ${velocity}) [Duration: ${NOTE_DURATION_MS}ms]`);

                                setTimeout(() => {
                                    if (activeOutput) {
                                        activeOutput.send([0x80 | channel, noteNumber, 0]);
                                        log(`🔇 NOTE OFF: ${noteNumber}`);
                                    }
                                }, NOTE_DURATION_MS);
                            }
                        }
                        return;
                    }
                }
            }
            if (activeOutput) {
                activeOutput.send(data);
            }
        }
    </script>
</body>
</html>
